name: Deploy presentation to GitHub Pages

# The validation steps read only repository-controlled files. No event input
# is interpolated into a shell command, so this workflow does not evaluate
# untrusted pull-request text.
on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "presentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate pitch deck
        run: python3 presentation/pitch/check.py

      - name: Validate EDA deck
        run: python3 presentation/eda/check.py

      # Builds the published tree. _site/ is throwaway output, so it mirrors
      # only what both decks need at runtime:
      #   /                 redirect to ./pitch/ (keeps the old root URL working)
      #   /tokens.css, /favicon.svg   shared by both decks
      #   /pitch/           index.html + assets/
      #   /eda/             index.html + deck.css + assets/
      # Design context (PRODUCT.md, DESIGN.md, README.md), .impeccable/,
      # scripts/, and check.py stay in the repository and are never published.
      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p _site/pitch _site/eda
          cp presentation/tokens.css presentation/favicon.svg _site/
          cp presentation/pitch/index.html _site/pitch/
          cp -R presentation/pitch/assets _site/pitch/
          cp presentation/eda/index.html presentation/eda/deck.css _site/eda/
          cp -R presentation/eda/assets _site/eda/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./pitch/">
              <title>Presentation</title>
              <link rel="icon" href="./favicon.svg" type="image/svg+xml">
            </head>
            <body>
              <p>Redirecting to the <a href="./pitch/">pitch deck</a>.</p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
